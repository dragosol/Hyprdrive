# awkward -- everything a hand-written theme does that a tidy parser does not expect.
#
# Trailing comments on values, a `source =` line, blank-line noise, a category
# closed and another opened at the top level, a variable used only by a leftover,
# a key that belongs to a Hyprland version this snapshot does not have, and --
# the one that matters for the writer rather than the reader -- a value
# containing `]]`, which would close a naive Lua long string early and turn the
# rest of somebody's config into code.

$term = kitty

source = ~/.config/hypr/mocha.conf

general {
    gaps_in = 4        # tight
    border_size = 2
}

decoration {
    rounding = 6
    blur {
        size = 5
    }
    inactive_opacity = 0.88
    definitely_not_a_real_key = 1
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = yes
    }
}

exec-once = $term --title "closes ]] a long string"
bind = SUPER, Return, exec, $term
layerrule = blur, waybar
