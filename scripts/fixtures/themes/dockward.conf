# dockward -- a theme that knows about the plugin.
#
# Two things this fixture is for. First, the plugin's own keys arrive the same
# way Hyprland's do -- through a nested `plugin { hyprdrive { dock { ... } } }`
# block -- so the path built by the parser's category stack has to come out as
# plugin:hyprdrive:dock:icon_size with no special case anywhere. Second, it
# carries a key the schema deliberately LOCKS (decoration:blur:enabled = false,
# which is the frost-everywhere product rule) and a key that simply does not
# exist, so both refusals can be measured rather than assumed.

decoration {
    rounding = 8

    blur {
        size = 4
        passes = 2
        enabled = false
        vibrancy_darkness = 0.55
    }
}

plugin {
    hyprdrive {
        dock {
            icon_size = 56
            corner_radius = 22
            autohide = false
        }

        col_highlight = rgba(d08770ff)
    }
}

exec-once = hyprpaper
