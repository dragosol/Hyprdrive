# mono -- a plain, well-formed hyprland.conf theme.
#
# Modelled on upstream's example hyprland.conf: variables at the top, the
# standard categories, one nested category (decoration:blur), and the directives
# every real theme carries. Everything here is either a schema key or a leftover,
# and this fixture exists so the importer's easy path is measured on something
# shaped like the thing people actually have.

$mainMod = SUPER
$accent = rgba(88c0d0ff)

general {
    gaps_in = 6
    gaps_out = 18
    border_size = 3
    col.active_border = $accent
}

decoration {
    rounding = 14
    active_opacity = 0.97

    blur {
        size = 9
        passes = 3
        noise = 0.0180
    }
}

animations {
    enabled = true
}

misc {
    disable_hyprland_logo = true
}

exec-once = waybar
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen, 1
windowrulev2 = opacity 0.90 0.90, class:^(kitty)$
